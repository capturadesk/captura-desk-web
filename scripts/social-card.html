<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Captura Desk social preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #191919;
        background: #fafafa;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      main {
        width: 100%;
        height: 100%;
        padding: 56px 64px;
        position: relative;
        border: 1px solid #e5e5e5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 27px;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .brand img {
        width: 42px;
        height: 42px;
      }
      h1 {
        position: relative;
        z-index: 1;
        margin: 63px 0 20px;
        width: 650px;
        font-size: 62px;
        line-height: 1.07;
        letter-spacing: -3px;
        font-weight: 650;
      }
      p {
        width: 475px;
        margin: 0;
        font-size: 23px;
        line-height: 1.5;
        color: #606060;
      }
      .domain {
        position: absolute;
        left: 64px;
        bottom: 53px;
        font-size: 19px;
        color: #525252;
      }
      .screenshot {
        position: absolute;
        left: 765px;
        top: 140px;
        width: 740px;
        border: 8px solid #fff;
        border-radius: 14px;
        box-shadow: 0 12px 60px #00000015;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="../public/images/icon.png" alt="" />Captura Desk</div>
      <h1>Turn your workflow<br />into clear<br />documentation.</h1>
      <p>Windows desktop app.<br />Your AI provider. Your files.</p>
      <span class="domain">capturadesk.com</span>
      <img
        class="screenshot"
        src="../public/images/workspace.jpg"
        alt="Captura Desk sample workflow"
      />
    </main>
  </body>
</html>
